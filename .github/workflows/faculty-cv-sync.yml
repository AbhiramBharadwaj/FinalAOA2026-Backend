name: One-time faculty CV sync

on:
  push:
    branches: ["ops/faculty-cv-sync-20261024"]
    paths: [".github/workflows/faculty-cv-sync.yml"]

permissions:
  contents: read

concurrency:
  group: faculty-cv-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout into separate directory
        uses: actions/checkout@v4
        with:
          path: faculty-cv-sync-task
      - name: Install dependencies
        working-directory: faculty-cv-sync-task
        env:
          NODE_OPTIONS: --max-old-space-size=256
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --maxsockets=1
      - name: Sync faculty details without restarting the backend
        working-directory: faculty-cv-sync-task
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          node --input-type=module <<'NODE'
          import dotenv from 'dotenv';
          const config = dotenv.parse(process.env.PROD_ENV_FILE || '');
          if (!config.MONGODB_URI) throw new Error('Production MONGODB_URI is missing; no sync performed');
          Object.assign(process.env, config);
          delete process.env.PROD_ENV_FILE;
          await import('./scripts/sync-faculty-cvs-from-sheet.js');
          NODE
