name: Node.js CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    env:
      UPLOAD_ROOT: /home/ubuntu/aoa-data/uploads

    steps:
    - name: Preserve uploads outside the Actions workspace
      run: |
        mkdir -p "$UPLOAD_ROOT"
        if [ -d "$GITHUB_WORKSPACE/uploads" ]; then
          cp -a "$GITHUB_WORKSPACE/uploads/." "$UPLOAD_ROOT/"
        fi

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        NODE_OPTIONS: --max-old-space-size=256
      run: npm ci --omit=dev --no-audit --no-fund --maxsockets=1

    - name: Create .env file
      env:
        RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      run: |
        cat <<EOF > .env
        ${{ secrets.PROD_ENV_FILE }}
        EOF
        printf '\nRAZORPAY_WEBHOOK_SECRET=%s\n' "$RAZORPAY_WEBHOOK_SECRET" >> .env

    - name: Start or Restart Application
      run: |
        pm2 restart aoa-backend --update-env || pm2 start server.js --name "aoa-backend"

    - name: Configure hourly registration sheet sync
      env:
        SHEET_SYNC_CONFIG: ${{ secrets.REGISTRATION_SHEET_SYNC_CONFIG }}
      run: |
        if [ -z "$SHEET_SYNC_CONFIG" ]; then
          echo "Hourly sheet sync setup skipped: REGISTRATION_SHEET_SYNC_CONFIG secret is not set."
          exit 0
        fi
        umask 077
        mkdir -p /home/ubuntu/aoa-data/registration-sheet-sync
        printf '%s' "$SHEET_SYNC_CONFIG" > /home/ubuntu/aoa-data/registration-sheet-sync/config.json
        chmod 600 /home/ubuntu/aoa-data/registration-sheet-sync/config.json
        node scripts/sync-registration-sheets.js
        systemctl is-active --quiet cron
        bash scripts/server/install-registration-sheet-cron.sh
        crontab -l | sed -n '/# aoa-registration-sheet-sync$/p'
