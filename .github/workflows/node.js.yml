name: Node.js CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    env:
      UPLOAD_ROOT: /home/ubuntu/aoa-data/uploads

    steps:
    - name: Preserve uploads outside the Actions workspace
      run: |
        mkdir -p "$UPLOAD_ROOT"
        if [ -d "$GITHUB_WORKSPACE/uploads" ]; then
          cp -a "$GITHUB_WORKSPACE/uploads/." "$UPLOAD_ROOT/"
        fi

    - name: Preserve existing database configuration
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        const destination = '/home/ubuntu/aoa-data/database.env';
        if (!fs.existsSync(destination) && fs.existsSync('server.js')) {
          const source = fs.readFileSync('server.js', 'utf8');
          const uri = source.match(/mongodb\+srv:\/\/[^'"\s]+/)?.[0];
          if (uri) {
            fs.mkdirSync('/home/ubuntu/aoa-data', { recursive: true });
            fs.writeFileSync(destination, `MONGODB_URI=${uri}\n`, { mode: 0o600 });
          }
        }
        NODE

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        NODE_OPTIONS: --max-old-space-size=256
      run: npm ci --omit=dev --no-audit --no-fund --maxsockets=1

    - name: Verify certificate portal tests
      run: node --test test/certificatePortal.test.js test/certificateRepository.test.js test/eventReadOnly.test.js

    - name: Create .env file
      env:
        RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      run: |
        cat <<EOF > .env
        ${{ secrets.PROD_ENV_FILE }}
        EOF
        printf '\nRAZORPAY_WEBHOOK_SECRET=%s\n' "$RAZORPAY_WEBHOOK_SECRET" >> .env

    - name: Load shared API credential
      run: |
        shared_key_file=/home/ubuntu/aoa-data/shared-read-api.env
        if [ -f "$shared_key_file" ]; then
          printf '\n' >> .env
          cat "$shared_key_file" >> .env
        fi

    - name: Load database and certificate portal configuration
      run: |
        database_env=/home/ubuntu/aoa-data/database.env
        if [ -f "$database_env" ]; then
          printf '\n' >> .env
          cat "$database_env" >> .env
        fi
        printf '\nCERTIFICATE_BUCKET_NAME=aoacon2026-certificates-private\nCERTIFICATE_PORTAL_ENABLED=true\n' >> .env
        chmod 600 .env

    - name: Verify private Cloudflare certificate index
      run: |
        node --input-type=module <<'NODE'
        import 'dotenv/config';
        import { certificateRepositories } from './services/certificateRepository.js';
        const count = await certificateRepositories.certs.countDocuments({});
        if (count < 1340) throw new Error('The approved certificate index is incomplete.');
        console.log(`Private Cloudflare certificate index verified: ${count} records.`);
        NODE

    - name: Start or Restart Application
      env:
        # Keep the backend outside the Actions runner's end-of-job process cleanup.
        RUNNER_TRACKING_ID: ""
      run: |
        pm2 restart aoa-backend --update-env || pm2 start server.js --name "aoa-backend"

    - name: Stop post-event registration sheet automation
      run: |
        existing="$(crontab -l 2>/dev/null || true)"
        printf '%s\n' "$existing" | sed '/# aoa-registration-sheet-sync$/d' | crontab -
