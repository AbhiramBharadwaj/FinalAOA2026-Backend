name: User-approved single sample announcement
on:
  push:
    branches: ["ops/email-access-check-20261025"]
    paths: [".github/workflows/email-sample.yml"]
permissions:
  contents: read
jobs:
  sample:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Send exactly one approved sample using the existing backend email service
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {pathToFileURL} = require('node:url');
          const path = require('node:path');
          (async () => {
            const apps = JSON.parse(execFileSync('pm2',['jlist'],{encoding:'utf8'}));
            const app = apps.find(a=>a.name==='aoa-backend');
            if(!app) throw new Error('Backend unavailable');
            const p=app.pm2_env;
            const cwd=p.pm_cwd;
            for(const [k,v] of Object.entries({...p.env,...p})) if(typeof v==='string') process.env[k]=v;
            process.chdir(cwd);
            require(require.resolve('dotenv',{paths:[cwd]})).config({path:path.join(cwd,'.env')});
            if((process.env.ZOHO_FROM_EMAIL || 'info@aoacon2026.com') !== 'info@aoacon2026.com') throw new Error('Unexpected Zoho sender');
            if(process.env.RESEND_FROM && !/info@aoacon2026\.com/i.test(process.env.RESEND_FROM)) throw new Error('Unexpected Resend sender');
            const mongoose = require(require.resolve('mongoose',{paths:[cwd]}));
            try {
              await mongoose.connect(process.env.MONGODB_URI,{serverSelectionTimeoutMS:15000});
              const {sendEmail}=await import(pathToFileURL(path.join(cwd,'utils/email.js')).href);
              const subject='[SAMPLE] AOACON 2026: E-Poster Presentations on Saturday, 31 October';
              const text='Dear Participant,\n\nGreetings from AOACON 2026.\n\nPlease note that the final e-poster presentations are scheduled for Saturday, 31 October 2026, and not Friday, 30 October.\n\nIndividual time slots and session details will be shared soon. Please plan your participation accordingly.\n\nWarm regards,\nAOACON 2026 Organising Team\n\nSample email for organiser review only.';
              const result=await sendEmail({to:'abhirambharadwaj10@gmail.com',subject,text,html:'<div style="font-family:Arial,sans-serif;line-height:1.6"><h2>AOACON 2026</h2><p>Dear Participant,</p><p>Greetings from AOACON 2026.</p><p>Please note that the final e-poster presentations are scheduled for <strong>Saturday, 31 October 2026</strong>, and <strong>not Friday, 30 October</strong>.</p><p>Individual time slots and session details will be shared soon. Please plan your participation accordingly.</p><p>Warm regards,<br>AOACON 2026 Organising Team</p><hr><p style="color:#666;font-size:12px">Sample email for organiser review only.</p></div>'});
              console.log('SAMPLE_ACCEPTED',JSON.stringify(result));
            } finally { await mongoose.disconnect(); }
          })().catch(e=>{console.error('Sample failed:',e.name);process.exitCode=1});
          NODE
