<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Certificate desk · AOACON 2026</title><link rel="stylesheet" href="/certificates/portal.css"><script type="module" src="/certificates/admin.js"></script></head><body>
<header class="masthead"><a class="brand" href="/certificates/">AOACON <span>2026</span></a><span class="header-note">Organiser certificate desk</span></header><main class="admin-main"><div class="admin-top"><div><p class="eyebrow">ORGANISER WORKSPACE</p><h1 style="font-size:48px">Certificate desk</h1></div><button id="logout" class="secondary" hidden>Sign out</button></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<form id="login" class="search-panel" style="max-width:500px"><h2>Organiser sign in</h2><p>Use your existing AOACON admin account.</p><label for="admin-email">Email</label><input id="admin-email" type="email" required autocomplete="username"><label for="admin-password">Password</label><input id="admin-password" type="password" required autocomplete="current-password"><button type="submit">Sign in</button></form>
<section id="workspace" hidden><nav class="admin-tabs" aria-label="Certificate desk sections"><button data-tab="queries">Correction requests</button><button class="secondary" data-tab="certificates">Certificates</button><button class="secondary" data-tab="deliveries">Email requests</button></nav><div class="admin-tools"><label for="status" class="hint">Filter requests</label><select id="status"><option value="new">New</option><option value="in_review">In review</option><option value="resolved">Resolved</option><option value="all">All requests</option></select><input id="filter" placeholder="Search name, email or certificate ID" aria-label="Search certificates" hidden><button id="refresh" class="secondary">Refresh</button></div><p id="count" class="hint"></p><div id="items"></div><div class="card-actions"><button id="previous" class="secondary" hidden>Previous page</button><button id="next" class="secondary" hidden>Next page</button></div></section>
<footer style="margin-top:40px">AOACON 2026 Organising Committee</footer></main></body></html>
